<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Abfall Schaffhausen</title>
  <meta name="description" content="Wann wird mein Abfall abgeholt? Abfuhrtermine der Stadt Schaffhausen.">

  <!-- Installierbar auf dem Startbildschirm -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="img/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="img/icons/icon-180.png" type="image/png">
  <link rel="apple-touch-icon" href="img/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Abfall SH">

  <!-- Schrift «Lato» wie auf stadt-schaffhausen.ch -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== Gelber Startbildschirm (verschwindet nach kurzer Zeit) ===== -->
  <div id="startbild" class="startbild" aria-hidden="true">
    <img src="img/icons/startbild.svg" alt="" width="186" height="186">
  </div>
  <script>
    // In der installierten App auf Android zeigt das System schon einen eigenen
    // Startbildschirm. Dann unseren weglassen, sonst springt das Icon.
    if (/Android/i.test(navigator.userAgent) && matchMedia("(display-mode: standalone)").matches) {
      document.getElementById("startbild").remove();
    }
  </script>

  <!-- ===== Oberer Balken mit Stadtlogo ===== -->
  <header class="kopf">
    <img class="logo" src="img/logo.png" alt="Stadt Schaffhausen"
         onerror="this.hidden = true; this.nextElementSibling.hidden = false;">
    <span class="logo-ersatz" hidden>Stadt Schaffhausen</span>
  </header>

  <main>
    <!-- ===== Tab «Abfall»: Suche und Ergebnis ===== -->
    <section id="tab-abfall" class="tab-inhalt">

      <div class="suchfeld">
        <input id="eingabe-strasse" type="text" placeholder="Strasse"
               autocomplete="off" autocapitalize="words" spellcheck="false"
               aria-label="Strasse" aria-controls="liste-strasse">
        <button class="leeren" type="button" data-fuer="eingabe-strasse" aria-label="Strasse löschen" hidden>×</button>
      </div>
      <ul id="liste-strasse" class="vorschlaege" hidden></ul>

      <div class="suchfeld">
        <input id="eingabe-abfall" type="text" placeholder="Abfall"
               autocomplete="off" spellcheck="false"
               aria-label="Abfall" aria-controls="liste-abfall">
        <button class="leeren" type="button" data-fuer="eingabe-abfall" aria-label="Abfall löschen" hidden>×</button>
      </div>
      <ul id="liste-abfall" class="vorschlaege" hidden></ul>

      <!-- Schnellwahl: die wichtigsten Abfallarten zum Antippen -->
      <div id="schnellwahl" class="schnellwahl" aria-label="Häufige Abfallarten"></div>

      <!-- Hier erscheint das grüne oder rote Ergebnisfeld -->
      <div id="ergebnis"></div>
    </section>

    <!-- ===== Tab «Termine» (kommt später) ===== -->
    <section id="tab-termine" class="tab-inhalt" hidden>
      <!-- Push-Erinnerungen ein/aus -->
      <div id="erinnerung-schalter" class="erinnerung-schalter">
        <div>
          <strong id="erinnerung-titel">Push-Erinnerungen</strong>
          <span class="klein"></span>
        </div>
        <button type="button" class="schalter" role="switch" aria-checked="false" aria-labelledby="erinnerung-titel"><span></span></button>
      </div>

      <!-- Umschalter: Liste, Woche, Monat, Jahr -->
      <div class="umschalter" role="group" aria-label="Ansicht">
        <button type="button" data-ansicht="liste">Liste</button>
        <button type="button" data-ansicht="woche">Woche</button>
        <button type="button" data-ansicht="monat" class="aktiv">Monat</button>
        <button type="button" data-ansicht="jahr">Jahr</button>
      </div>
      <div id="kalender-inhalt"></div>
    </section>

    <!-- ===== Tab «Abfall-ABC»: welcher Gegenstand gehört wohin (js/abc.js) ===== -->
    <section id="tab-abc" class="tab-inhalt" hidden>
      <div class="suchfeld">
        <input id="abc-suche" type="search" placeholder="Gegenstand"
               autocomplete="off" spellcheck="false" aria-label="Gegenstand suchen">
      </div>

      <!-- Umschalter: nach Abfallart oder A bis Z -->
      <div class="umschalter" role="group" aria-label="Ansicht">
        <button type="button" data-abc="arten" class="aktiv">Nach Abfallart</button>
        <button type="button" data-abc="az">A–Z</button>
      </div>
      <div id="abc-inhalt"></div>

      <p class="abc-fuss">Unklar? Abfalltelefon <a href="tel:+41526325329">052 632 53 29</a></p>
    </section>

    <!-- ===== Tab «Karte»: Sammelstellen, Brockenhäuser, Reparieren (js/karte.js) ===== -->
    <section id="tab-karte" class="tab-inhalt" hidden>
      <div id="karten-filter" class="karten-filter" role="group" aria-label="Was anzeigen"></div>
      <div id="karten-flaeche" class="karten-flaeche"></div>
    </section>
  </main>

  <!-- ===== Übersicht eines Termins (Kalender) und kurze Meldungen ===== -->
  <div id="uebersicht" class="uebersicht" hidden></div>
  <div id="meldung" class="meldung" role="status" hidden></div>

  <!-- ===== Untere Leiste mit vier Tabs (nur Icons) ===== -->
  <nav class="tableiste" aria-label="Navigation">
    <!-- weisse Leiste mit runder Einbuchtung, gezeichnet von js/leiste.js -->
    <svg class="leiste-grund" aria-hidden="true" preserveAspectRatio="none"><path/></svg>
    <button class="tab aktiv" type="button" data-tab="abfall" aria-label="Abfall">

    </button>
