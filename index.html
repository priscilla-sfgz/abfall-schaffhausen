<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Abfall Schaffhausen</title>
  <meta name="description" content="Wann wird mein Abfall abgeholt? Abfuhrtermine der Stadt Schaffhausen.">

  <!-- Installierbar auf dem Startbildschirm -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="img/icons/icon-192.png">
  <link rel="apple-touch-icon" href="img/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Abfall SH">

  <!-- Schrift «Lato» wie auf stadt-schaffhausen.ch -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== Oberer Balken mit Stadtlogo ===== -->
  <header class="kopf">
    <img class="logo" src="img/logo.png" alt="Stadt Schaffhausen"
         onerror="this.hidden = true; this.nextElementSibling.hidden = false;">
    <span class="logo-ersatz" hidden>Stadt Schaffhausen</span>
  </header>

  <main>
    <!-- ===== Tab «Abfall»: Suche und Ergebnis ===== -->
    <section id="tab-abfall" class="tab-inhalt">

      <div class="suchfeld">
        <input id="eingabe-strasse" type="text" placeholder="Strasse"
               autocomplete="off" autocapitalize="words" spellcheck="false"
               aria-label="Strasse" aria-controls="liste-strasse">
        <button class="leeren" type="button" data-fuer="eingabe-strasse" aria-label="Strasse löschen" hidden>×</button>
      </div>
      <ul id="liste-strasse" class="vorschlaege" hidden></ul>

      <div class="suchfeld">
        <input id="eingabe-abfall" type="text" placeholder="Abfall"
               autocomplete="off" spellcheck="false"
               aria-label="Abfall" aria-controls="liste-abfall">
        <button class="leeren" type="button" data-fuer="eingabe-abfall" aria-label="Abfall löschen" hidden>×</button>
      </div>
      <ul id="liste-abfall" class="vorschlaege" hidden></ul>

      <!-- Hier erscheint das grüne oder rote Ergebnisfeld -->
      <div id="ergebnis"></div>
    </section>

    <!-- ===== Tab «Termine» (kommt später) ===== -->
    <section id="tab-termine" class="tab-inhalt" hidden>
      <p class="platzhalter">Hier kommen später deine angepinnten Termine hin.</p>
    </section>

    <!-- ===== Tab «Infos» (kommt später) ===== -->
    <section id="tab-infos" class="tab-inhalt" hidden>
      <p class="platzhalter">Hier kommen später Infos zu Abfallarten und Sammelstellen hin.</p>
    </section>
  </main>

  <!-- ===== Untere Leiste mit drei Tabs (nur Icons) ===== -->
  <nav class="tableiste" aria-label="Navigation">
    <button class="tab aktiv" type="button" data-tab="abfall" aria-label="Abfall">
      <!-- Abfallsack -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M10.2 7.5 7.5 2.8l3.2 1.6L12 3l1.3 1.4 3.2-1.6-2.7 4.7"/>
        <path d="M10.2 7.5h3.6c4.2 2 6.2 6 6.2 9.4 0 2.8-2.6 4.1-8 4.1s-8-1.3-8-4.1c0-3.4 2-7.4 6.2-9.4z"/>
        <path d="M9.5 7.5h5"/>
      </svg>
    </button>
    <button class="tab" type="button" data-tab="termine" aria-label="Termine">
      <!-- Kalender -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/>
        <path d="M3.5 10h17M8 3v4M16 3v4"/>
      </svg>
    </button>
    <button class="tab" type="button" data-tab="infos" aria-label="Infos">
      <!-- Info -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="8.5"/>
        <path d="M12 11v5.5"/>
        <circle cx="12" cy="7.8" r=".6" class="gefuellt"/>
      </svg>
    </button>
  </nav>

  <!-- Daten zuerst laden, dann die App-Logik -->
  <script src="data/touren.js"></script>
  <script src="data/abfallarten.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
